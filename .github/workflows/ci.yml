name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, gd, zip, intl, openssl
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Tests run on in-memory SQLite (see phpunit.xml); they need an app key but no real secrets.
      - run: cp .env.example .env && php artisan key:generate

      - name: Code style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      - name: Known vulnerabilities in dependencies
        run: composer audit
